<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Clean store page</title></head>
<body>
  <header>
    <a href="/"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Example Store home"></a>
    <button type="button" aria-label="Open menu"><svg aria-hidden="true" width="10" height="10"></svg></button>
  </header>
  <main>
    <h1>Linen shirt</h1>
    <p style="color:#333;background:#fff">Breathable linen, cut for summer.</p>
    <form>
      <label for="qty">Quantity</label>
      <input id="qty" type="number" value="1">
      <label for="email">Email for restock alerts</label>
      <input id="email" type="email">
      <button type="submit">Add to cart</button>
    </form>
  </main>
  <footer><a href="/pages/contact">Contact us</a></footer>
</body>
</html>
