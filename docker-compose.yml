# Local Postgres for the app, sessions and pg-boss queues.
# Start it with: npm run db:up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wideaisle
      POSTGRES_PASSWORD: wideaisle
      POSTGRES_DB: wideaisle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wideaisle"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
